# Pullim Admissions Coach — staging web deploy
# Builds apps/web Docker image, pushes to ECR, updates ECS service.
# OIDC auth (no long-lived AWS keys). Triggered on push to main + manual.
#
# Required GitHub repo settings (configured by DevOps):
#   Secrets/Vars (Repository or Environment "staging"):
#     - AWS_OIDC_ROLE_ARN_STAGING  (IAM role with AssumeRoleWithWebIdentity for this repo)
#     - AWS_REGION                 (= ap-northeast-2)
#     - ECR_REPOSITORY_WEB         (e.g. pullim-admissions-coach-web)
#     - ECS_CLUSTER_STAGING        (e.g. pullim-staging)
#     - ECS_SERVICE_WEB_STAGING    (e.g. pullim-web)
#     - ECS_TASK_DEFINITION_WEB    (family name, e.g. pullim-web)
#     - ECS_CONTAINER_NAME_WEB     (= web, must match task def)
#
# Notes:
#   - Phase 0 deploys staging only. prod added by separate workflow when ready.
#   - api/admin services get sibling workflows in Phase C.

name: deploy-staging-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-staging-web.yml'
  workflow_dispatch:

# OIDC + reading repo
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: staging
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short sha)
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_WEB }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_WEB }}:staging-latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION_WEB }} \
            --query taskDefinition > task-def.json

      - name: Render new task definition (update image)
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME_WEB }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_WEB }}:${{ steps.tag.outputs.tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER_STAGING }}
          service: ${{ vars.ECS_SERVICE_WEB_STAGING }}
          wait-for-service-stability: true
