# Pullim Admissions Coach — staging web deploy
# Builds apps/web Docker image, pushes to ECR, updates ECS service.
# OIDC auth (no long-lived AWS keys). Triggered on push to dev + manual.
# (브랜치 모델: feature→dev(통합/staging)→main(운영). staging 은 dev 브랜치가 소유.)
#
# Required GitHub repo settings (configured by DevOps):
#   Secrets/Vars (Repository or Environment "staging"):
#     - AWS_OIDC_ROLE_ARN_STAGING  (IAM role with AssumeRoleWithWebIdentity for this repo)
#     - AWS_REGION                 (= ap-northeast-2)
#     - ECR_REPOSITORY_WEB         (e.g. pullim-admissions-coach-web)
#     - ECS_CLUSTER_STAGING        (e.g. pullim-staging)
#     - ECS_SERVICE_WEB_STAGING    (e.g. pullim-web)
#     - ECS_TASK_DEFINITION_WEB    (family name, e.g. pullim-web)
#     - ECS_CONTAINER_NAME_WEB     (= web, must match task def)
#
# Notes:
#   - Phase 0 deploys staging only. prod added by separate workflow when ready.
#   - api/admin services get sibling workflows in Phase C.
#
# ⚠️ 2026-09-19 — 수동 실행 전용(workflow_dispatch)으로 내렸다.
# ⚠️ 2026-09-20 — 이 워크플로가 전제하는 **AWS staging 환경은 존재하지 않는다.** 3계정 분리
#    계획이 실행되지 않았고 ADR-058 로 불필요해졌다(infra/README.md 배너). 아래 변수들은
#    채워질 일이 없다. 남겨 둔 이유는 ECS 배포가 다시 필요해질 때의 출발점이기 때문이고,
#    지금은 **동작하지 않는 문서**로 취급할 것. 현행 프론트 배포는 Vercel 이다.
#   위 변수·시크릿이 아직 하나도 채워져 있지 않다. AWS Organizations + 3계정(런북 1단계)이
#   Gate keeper 회신 대기라 채울 수가 없고, 그래서 dev 푸시마다 첫 AWS 스텝에서
#   `Input required and not supplied: aws-region` 으로 죽었다(최소 2026-09-10 이후 전건 실패).
#   실제 배포는 그동안 Vercel 이 해왔으므로 이 실패는 아무것도 막지 않고 빨간불만 남겼다.
#
#   워크플로 자체는 폐기가 아니다 — 계정이 생기는 날 쓰려고 미리 짜둔 Phase 0 핸드오프
#   산출물이다(`infra/README.md` §2, `docs/009_..._demo_scenario` A).
#   **복구 절차:** 런북 §2 표대로 변수·시크릿을 채우고 workflow_dispatch 로 한 번 성공시킨 뒤,
#   아래 `push:` 블록의 주석을 풀어 자동 배포로 되돌린다.

name: deploy-staging-web

on:
  # 변수가 채워지기 전까지 자동 트리거를 끈다(위 ⚠️ 참조). 복구 시 주석만 푼다.
  # push:
  #   branches: [dev]
  #   paths:
  #     - 'apps/web/**'
  #     - 'packages/shared/**'
  #     - 'pnpm-lock.yaml'
  #     - '.github/workflows/deploy-staging-web.yml'
  workflow_dispatch:

# OIDC + reading repo
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: staging
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short sha)
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_WEB }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_WEB }}:staging-latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION_WEB }} \
            --query taskDefinition > task-def.json

      - name: Render new task definition (update image)
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME_WEB }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_WEB }}:${{ steps.tag.outputs.tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER_STAGING }}
          service: ${{ vars.ECS_SERVICE_WEB_STAGING }}
          wait-for-service-stability: true
